name: Build K40 ReSukiSU Kernel
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Device defconfig"
        default: "alioth"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libssl-dev bc bison flex libelf-dev zip wget clang lld llvm

      - name: Merge alioth defconfig
        run: |
          cat arch/arm64/configs/gki_defconfig \
              arch/arm64/configs/vendor/xiaomi/sm8250-common.config \
              arch/arm64/configs/vendor/xiaomi/alioth.config > arch/arm64/configs/alioth_defconfig
          echo -e "\n# ReSukiSU\nCONFIG_KSU=y\nCONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/alioth_defconfig

      - name: Build kernel (force ignore all warnings)
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          make alioth_defconfig
          scripts/config --disable WERROR
          scripts/config --disable DEBUG_KERNEL
          scripts/config --disable LOCKDEP
          make olddefconfig
          # 强制忽略所有警告，不管什么warning都不报错
          make -j$(nproc) LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error -Wno-unused-function -Wno-implicit-function-declaration -Wno-int-conversion -Wno-return-type -Wno-address-of-packed-member -Wno-unused-variable -Wno-unused-but-set-variable"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: K40-ReSukiSU-Kernel
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/Image
          retention-days: 7
