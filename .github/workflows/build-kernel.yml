name: Build K40 ReSukiSU Kernel
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Device defconfig"
        default: "alioth"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies and old clang 15
        run: |
          sudo apt update
          sudo apt install -y build-essential libssl-dev bc bison flex libelf-dev zip
          sudo apt install -y clang-15 lld-15

      - name: Merge alioth defconfig
        run: |
          cat arch/arm64/configs/vendor/kona_defconfig \
              arch/arm64/configs/vendor/xiaomi/sm8250-common.config \
              arch/arm64/configs/vendor/xiaomi/alioth.config > arch/arm64/configs/alioth_defconfig
          echo -e "\n# ReSukiSU\nCONFIG_KSU=y\nCONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/alioth_defconfig

      - name: Build kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          CC: clang-15
          LD: lld-15
        run: |
          make alioth_defconfig
          make -j2 LLVM=1 LLVM_IAS=1

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: K40-ReSukiSU-Kernel
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/Image
          retention-days: 7
